<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emby 媒体库封面生成器</title>
  <style>
    :root {
      --bg-color: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --input-bg: #0b1120;
      --input-border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 10px 16px;
    }

    header {
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    header .title-area h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    header .title-area span {
      color: var(--text-muted);
      font-size: 11px;
      margin-left: 8px;
    }

    .main-container {
      display: flex;
      gap: 14px;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .control-panel {
      width: 450px;
      flex-shrink: 0;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      height: 100%;
      overflow: hidden;
    }

    .tab-header {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid var(--card-border);
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 6px;
      font-size: 12px;
      font-weight: 600;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
      border-bottom: 2px solid transparent;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
    }

    .tab-btn.active {
      color: #60a5fa;
      border-bottom-color: #60a5fa;
      background: rgba(59, 130, 246, 0.08);
    }

    .tab-content-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tab-panel {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .tab-panel.active {
      display: flex;
    }

    #tab-images.tab-panel.active {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }



    .preset-mode-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .preset-mode-btn {
      padding: 8px 4px;
      font-size: 11px;
      font-weight: 600;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .preset-mode-btn:hover {
      border-color: var(--accent);
      color: var(--text-main);
    }

    .preset-mode-btn.active {
      background: rgba(59, 130, 246, 0.15);
      border-color: var(--accent);
      color: #60a5fa;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group label span.val-badge {
      color: #60a5fa;
      font-family: monospace;
      font-size: 11px;
    }

    .form-control {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--text-main);
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .color-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .color-btn {
      padding: 3px 6px;
      font-size: 11px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-muted);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .color-btn:hover {
      border-color: var(--accent);
      color: var(--text-main);
    }

    .color-btn.danger-btn {
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .color-btn.danger-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--danger);
      color: #fff;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .font-upload-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 8px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px dashed var(--accent);
      color: #93c5fd;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
    }

    .font-upload-btn:hover {
      background: rgba(59, 130, 246, 0.2);
    }

    .batch-url-box {
      margin-top: 10px;
      padding: 10px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .batch-url-box textarea {
      width: 100%;
      height: 70px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 11px;
      font-family: monospace;
      padding: 6px 8px;
      resize: vertical;
      line-height: 1.4;
    }

    .batch-url-box textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .batch-url-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    .file-drop-zone {
      border: 2px dashed var(--input-border);
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.4);
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .file-drop-zone:hover {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.05);
    }

    .file-drop-zone p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .image-tag-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 4px;
      flex: 1;
    }

    .image-tag-item {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid var(--input-border);
      border-radius: 6px;
      padding: 5px 8px;
      gap: 8px;
      cursor: grab;
      user-select: none;
      transition: all 0.15s;
    }

    .image-tag-item:hover {
      border-color: #475569;
      background: #1e293b;
    }

    .image-tag-item:active { cursor: grabbing; }
    .image-tag-item.dragging { opacity: 0.35; border: 1px dashed var(--accent); }
    .image-tag-item.drag-over { border-top: 2px solid #60a5fa; background: rgba(59, 130, 246, 0.15); }

    .item-drag-handle { color: var(--text-muted); font-size: 13px; cursor: grab; }
    .item-thumb { width: 28px; height: 38px; border-radius: 4px; object-fit: cover; background: #0b1120; flex-shrink: 0; }
    .item-info { flex: 1; font-size: 12px; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }

    .item-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .item-action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
    }
    .item-action-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.15); }
    .item-action-btn.del-btn:hover { color: #fff; background: var(--danger); border-color: var(--danger); }

    .empty-placeholder {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      padding: 30px 0;
      border: 1px dashed var(--input-border);
      border-radius: 6px;
    }

    .preview-panel {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      min-width: 0;
      height: 100%;
    }

    .preview-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .resolution-badge {
      background: #0284c7;
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 8px;
      font-weight: 600;
      margin-left: 6px;
    }



    .preview-viewport {
      flex: 1;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      min-height: 0;
    }

    .scaler-wrapper {
      position: absolute;
      width: 1920px;
      height: 1080px;
      transform-origin: center center;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.15s ease-out;
    }

    #cover-container {
      width: 1920px;
      height: 1080px;
      display: flex;
      overflow: hidden;
      position: relative;
      user-select: none;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
    }

    .cover-left {
      width: 1920px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding-left: 120px;
      z-index: 2;
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }

    .cover-title {
      font-size: 114px;
      color: #ffffff;
      font-weight: 800;
      letter-spacing: 10px;
      margin-bottom: 16px;
      word-break: break-all;
      white-space: pre-wrap;
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
      font-family: inherit;
      line-height: 1.15;
    }

    .cover-subtitle {
      font-size: 48px;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 16px;
      font-family: 'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Courier, monospace;
      text-transform: uppercase;
      margin-left: 6px;
      font-weight: 600;
    }

    .cover-right {
      width: 1920px;
      height: 1080px;
      position: absolute;
      left: 0;
      top: 0;
      z-index: 1;
    }

    .cover-card {
      width: 330px;
      height: 462px;
      border-radius: 36px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      background: #1e293b;
      position: absolute;
      cursor: grab;
      transition: filter 0.15s;
    }

    .cover-card:active { cursor: grabbing; }
    .cover-card.dragging { opacity: 0.35; outline: 6px dashed #60a5fa; }
    .cover-card.drag-over { outline: 8px solid #38bdf8; filter: brightness(1.2); }

    .cover-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .github-link {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .github-link:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
      border-color: #475569;
    }

    .range-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .range-wrap input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <h1>Emby 媒体库封面生成器</h1>
      <span>纯前端 离线运行</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <a href="https://github.com/binaryu/media-cover" target="_blank" rel="noopener noreferrer" class="github-link" title="GitHub 源码仓库">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path>
        </svg>
        GitHub
      </a>
      <button class="btn-primary" onclick="exportPoster()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        下载 1080P 高清封面 (PNG)
      </button>
    </div>
  </header>

  <div class="main-container">
    <!-- 左侧控制面板（选项卡平铺架构） -->
    <div class="control-panel">
      <!-- 顶部 Tab 栏 -->
      <div class="tab-header">
        <button class="tab-btn active" onclick="switchTab('tab-text')"> 标题文字</button>
        <button class="tab-btn" onclick="switchTab('tab-bg')"> 背景与色彩</button>
        <button class="tab-btn" onclick="switchTab('tab-layout')"> 海报矩阵</button>
        <button class="tab-btn" onclick="switchTab('tab-images')"> 素材库</button>
      </div>

      <!-- 内容区 -->
      <div class="tab-content-wrap">

        <!-- Tab 1: 标题与文字排版 -->
        <div id="tab-text" class="tab-panel active">
          <div class="section-title">主标题配置</div>
          <div class="form-group">
            <label>主标题文本</label>
            <input type="text" id="inputTitle" class="form-control" value="电影" placeholder="例如：电影、纪录片、4K 原盘" />
          </div>

          <div class="row-2">
            <div class="form-group">
              <label>主标题字号 <span class="val-badge" id="titleSizeBadge">114px</span></label>
              <div class="range-wrap">
                <input type="range" id="inputTitleSize" min="50" max="220" value="114" />
              </div>
            </div>
            <div class="form-group">
              <label>字间距 <span class="val-badge" id="titleSpacingBadge">10px</span></label>
              <div class="range-wrap">
                <input type="range" id="inputTitleSpacing" min="0" max="40" value="10" />
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>标题字体风格</label>
            <select id="fontSelect" class="form-control">
              <option value="default">系统默认无衬线黑体</option>
              <option value="'FZLanTingHei', 'Microsoft YaHei', sans-serif">兰亭黑/微软雅黑</option>
              <option value="'Songti SC', 'SimSun', serif">宋体</option>
              <option value="'KaiTi', 'STKaiti', serif">楷体</option>
              <option value="'Impact', 'Arial Black', sans-serif">Impact</option>
              <option value="custom" id="customFontOption" disabled>⭐ 自定义字体 (未载入)</option>
            </select>
          </div>

          <div class="form-group">
            <div class="font-upload-btn" onclick="document.getElementById('fontInput').click()">
              <input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2" style="display: none;" />
              <span>📁 上传本地字体文件 (.ttf / .otf / .woff2)</span>
            </div>
          </div>

          <div class="section-title" style="margin-top: 6px;">副标题与颜色</div>
          <div class="form-group">
            <label>副标题内容</label>
            <input type="text" id="inputSubtitle" class="form-control" value="MOVIES" placeholder="MOVIES, 4K UHD, ANIME..." />
          </div>

          <div class="row-2">
            <div class="form-group">
              <label>副标题字号 <span class="val-badge" id="subSizeBadge">48px</span></label>
              <div class="range-wrap">
                <input type="range" id="inputSubSize" min="20" max="90" value="48" />
              </div>
            </div>
            <div class="form-group">
              <label>副标题间距 <span class="val-badge" id="subSpacingBadge">16px</span></label>
              <div class="range-wrap">
                <input type="range" id="inputSubSpacing" min="0" max="50" value="16" />
              </div>
            </div>
          </div>

          <div class="row-2">
            <div class="form-group">
              <label>主标题颜色</label>
              <input type="color" id="titleColor" class="form-control" value="#ffffff" style="height: 32px; padding: 2px;" />
            </div>
            <div class="form-group">
              <label>副标题颜色</label>
              <input type="color" id="subColor" class="form-control" value="#e2e8f0" style="height: 32px; padding: 2px;" />
            </div>
          </div>

          <div class="section-title" style="margin-top: 6px;">文字自由平移</div>
          <div class="row-2">
            <div class="form-group">
              <label>水平位置 (X) <span class="val-badge" id="titleXBadge">0px</span></label>
              <div class="range-wrap">
                <input type="range" id="inputTitleX" min="-120" max="800" value="0" />
              </div>
            </div>
            <div class="form-group">
              <label>垂直位置 (Y) <span class="val-badge" id="titleYBadge">0px</span></label>
              <div class="range-wrap">
                <input type="range" id="inputTitleY" min="-400" max="400" value="0" />
              </div>
            </div>
          </div>
        </div>

        <!-- Tab 2: 背景与色彩 -->
        <div id="tab-bg" class="tab-panel">
          <div class="section-title">快速色系预设</div>
          <div class="color-presets">
            <button class="color-btn" onclick="applyPreset('blue')">深海冷蓝</button>
            <button class="color-btn" onclick="applyPreset('purple')">极光幻紫</button>
            <button class="color-btn" onclick="applyPreset('teal')">青瓷青绿</button>
            <button class="color-btn" onclick="applyPreset('green')">森林墨绿</button>
            <button class="color-btn" onclick="applyPreset('warm')">烈焰暖红</button>
            <button class="color-btn" onclick="applyPreset('gold')">流光黑金</button>
            <button class="color-btn" onclick="applyPreset('dark')">深邃暗夜</button>
            <button class="color-btn" onclick="randomizeGradient()">🎲 随机色彩</button>
          </div>

          <div class="section-title" style="margin-top: 8px;">自定义渐变参数</div>
          <div class="row-2">
            <div class="form-group">
              <label>渐变起始色</label>
              <input type="color" id="colorStart" class="form-control" value="#1e3a8a" style="height: 34px; padding: 2px;" />
            </div>
            <div class="form-group">
              <label>渐变结束色</label>
              <input type="color" id="colorEnd" class="form-control" value="#0ea5e9" style="height: 34px; padding: 2px;" />
            </div>
          </div>

          <div class="form-group">
            <label>渐变分布方向</label>
            <select id="gradientAngle" class="form-control">
              <option value="120deg">对角渐变 120° </option>
              <option value="45deg">对角渐变 45°</option>
              <option value="90deg">水平横向渐变 90°</option>
              <option value="180deg">垂直纵向渐变 180°</option>
              <option value="radial">径向中心扩散 (Radial Glow)</option>
            </select>
          </div>
        </div>

        <!-- Tab 3: 海报排版高定 -->
        <div id="tab-layout" class="tab-panel">
          <div class="section-title">排版预设模式 (一键展开/层叠/网格)</div>
          <div class="preset-mode-group">
            <button class="preset-mode-btn" onclick="applyLayoutMode('expanded')">完全展开 (不重叠)</button>
            <button class="preset-mode-btn active" onclick="applyLayoutMode('cascade')">经典错落 (层叠)</button>
            <button class="preset-mode-btn" onclick="applyLayoutMode('grid')">齐整方阵 (垂直网格)</button>
          </div>

          <div class="section-title" style="margin-top: 10px;">海报卡片倾角与尺寸</div>
          <div class="form-group">
            <label>倾斜角度 <span class="val-badge" id="cardAngleBadge">20°</span></label>
            <div class="range-wrap">
              <input type="range" id="cardAngle" min="0" max="45" value="20" />
            </div>
          </div>

          <div class="row-2">
            <div class="form-group">
              <label>卡片宽度 <span class="val-badge" id="cardWidthBadge">330px</span></label>
              <div class="range-wrap">
                <input type="range" id="inputCardW" min="160" max="520" value="330" />
              </div>
            </div>
            <div class="form-group">
              <label>卡片圆角 <span class="val-badge" id="cardRadiusBadge">36px</span></label>
              <div class="range-wrap">
                <input type="range" id="inputCardRadius" min="0" max="60" value="36" />
              </div>
            </div>
          </div>

          <div class="section-title" style="margin-top: 8px;">海报间距与展开程度</div>
          <div class="row-2">
            <div class="form-group">
              <label>列横向间距 (X) <span class="val-badge" id="colGapBadge">360px</span></label>
              <div class="range-wrap">
                <input type="range" id="inputColGap" min="150" max="800" value="360" />
              </div>
            </div>
            <div class="form-group">
              <label>行纵向间距 (Y) <span class="val-badge" id="rowGapBadge">420px</span></label>
              <div class="range-wrap">
                <input type="range" id="inputRowGap" min="200" max="800" value="420" />
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>列级梯级错位落差 <span class="val-badge" id="stepOffsetBadge">55px</span></label>
            <div class="range-wrap">
              <input type="range" id="inputStepOffset" min="-150" max="200" value="55" />
            </div>
          </div>

          <div class="section-title" style="margin-top: 8px;">海报群整体坐标偏移 (X / Y)</div>
          <div class="row-2">
            <div class="form-group">
              <label>横向位置 (X) <span class="val-badge" id="gridXBadge">860px</span></label>
              <div class="range-wrap">
                <input type="range" id="inputGridX" min="300" max="1400" value="860" />
              </div>
            </div>
            <div class="form-group">
              <label>纵向位置 (Y) <span class="val-badge" id="gridYBadge">-60px</span></label>
              <div class="range-wrap">
                <input type="range" id="inputGridY" min="-300" max="200" value="-60" />
              </div>
            </div>
          </div>
        </div>

        <!-- Tab 4: 素材库管理 (全平铺架构，无需额外内层滚动) -->
        <div id="tab-images" class="tab-panel">
          <div class="section-title">本地素材上传</div>
          <div class="file-drop-zone" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" multiple accept="image/*" style="display: none;" />
            <div style="font-size: 13px; font-weight: 600;">📁 点击或拖入本地海报图片</div>
            <p>支持批量选择（图片直接在画布内支持拖拽交换位置）</p>
          </div>

          <div class="section-title" style="margin-top: 10px;">批量海报链接导入 (URL)</div>
          <div class="batch-url-box">
            <textarea id="batchUrlInput" placeholder="每行一条图片 URL，支持 http:// 或 https:// 链接"></textarea>
            <div class="batch-url-actions">
              <button class="color-btn" onclick="importBatchUrls(false)">追加导入</button>
              <button class="color-btn" style="background: rgba(59, 130, 246, 0.2); border-color: var(--accent); color: #93c5fd;" onclick="importBatchUrls(true)">覆盖导入</button>
            </div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
            <div class="section-title" style="margin: 0;">已载入素材清单 (<span id="imgCount">9</span>)</div>
            <div style="display: flex; gap: 6px;">
              <button class="color-btn danger-btn" onclick="clearAllPosters()">🗑️ 清空所有</button>
              <button class="color-btn" onclick="loadDefaultPosters()">恢复默认海报</button>
            </div>
          </div>

          <div id="imageList" class="image-tag-list"></div>
        </div>

      </div>
    </div>

    <!-- 右侧效果预览与导出区域 -->
    <div class="preview-panel">
      <div class="preview-header">
        <div style="display: flex; align-items: center;">
          <span style="font-size: 13px; font-weight: 600;">1080P 预览</span>
        </div>
      </div>

      <div class="preview-viewport" id="previewViewport">
        <div class="scaler-wrapper" id="scalerWrapper">
          <div id="cover-container">
            <div class="cover-left" id="coverLeftBlock">
              <div class="cover-title" id="previewTitle">电影</div>
              <div class="cover-subtitle" id="previewSubtitle">MOVIES</div>
            </div>
            <div class="cover-right" id="posterGrid">
              <!-- 动态填充 9 张海报卡片 -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 默认内置高清海报占位图
    const DEFAULT_POSTERS = [
      { id: '1', name: '肖申克的救赎', url: 'https://image.tmdb.org/t/p/w500/q6y0Go1tsGEsmtFryDOJo3dEmqu.jpg' },
      { id: '2', name: '教父', url: 'https://image.tmdb.org/t/p/w500/3bhkrj58Vtu7enYsRolD1fZdja1.jpg' },
      { id: '3', name: '黑暗骑士', url: 'https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg' },
      { id: '4', name: '奥本海默', url: 'https://image.tmdb.org/t/p/w500/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg' },
      { id: '5', name: '星际穿越', url: 'https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg' },
      { id: '6', name: '搏击俱乐部', url: 'https://image.tmdb.org/t/p/w500/pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg' },
      { id: '7', name: '指环王', url: 'https://image.tmdb.org/t/p/w500/rCzpDGLbOoPwLjy3OAm5NUPOTrC.jpg' },
      { id: '8', name: '盗梦空间', url: 'https://image.tmdb.org/t/p/w500/saHP97rTPS5eLmrLQEcANmKrsFl.jpg' },
      { id: '9', name: '低俗小说', url: 'https://image.tmdb.org/t/p/w500/d5iIlFn5s0ImszYzBPb8JPIfbXD.jpg' }
    ];

    let currentPosters = JSON.parse(JSON.stringify(DEFAULT_POSTERS));

    const PRESETS = {
      blue: { start: '#1e3a8a', end: '#0ea5e9', angle: '120deg' },
      purple: { start: '#4c1d95', end: '#a855f7', angle: '120deg' },
      teal: { start: '#134e4a', end: '#14b8a6', angle: '120deg' },
      green: { start: '#14532d', end: '#22c55e', angle: '120deg' },
      warm: { start: '#881337', end: '#f43f5e', angle: '120deg' },
      gold: { start: '#78350f', end: '#eab308', angle: '120deg' },
      dark: { start: '#090d16', end: '#1e293b', angle: '120deg' }
    };

    // DOM 元素
    const inputTitle = document.getElementById('inputTitle');
    const inputTitleSize = document.getElementById('inputTitleSize');
    const titleSizeBadge = document.getElementById('titleSizeBadge');
    const inputTitleSpacing = document.getElementById('inputTitleSpacing');
    const titleSpacingBadge = document.getElementById('titleSpacingBadge');

    const inputTitleX = document.getElementById('inputTitleX');
    const titleXBadge = document.getElementById('titleXBadge');
    const inputTitleY = document.getElementById('inputTitleY');
    const titleYBadge = document.getElementById('titleYBadge');
    const coverLeftBlock = document.getElementById('coverLeftBlock');

    const inputSubtitle = document.getElementById('inputSubtitle');
    const inputSubSize = document.getElementById('inputSubSize');
    const subSizeBadge = document.getElementById('subSizeBadge');
    const inputSubSpacing = document.getElementById('inputSubSpacing');
    const subSpacingBadge = document.getElementById('subSpacingBadge');
    const titleColor = document.getElementById('titleColor');
    const subColor = document.getElementById('subColor');

    const fontSelect = document.getElementById('fontSelect');
    const fontInput = document.getElementById('fontInput');
    const customFontOption = document.getElementById('customFontOption');

    const previewTitle = document.getElementById('previewTitle');
    const previewSubtitle = document.getElementById('previewSubtitle');
    const colorStart = document.getElementById('colorStart');
    const colorEnd = document.getElementById('colorEnd');
    const gradientAngle = document.getElementById('gradientAngle');

    // 海报参数
    const cardAngle = document.getElementById('cardAngle');
    const cardAngleBadge = document.getElementById('cardAngleBadge');
    const inputCardW = document.getElementById('inputCardW');
    const cardWidthBadge = document.getElementById('cardWidthBadge');
    const inputCardRadius = document.getElementById('inputCardRadius');
    const cardRadiusBadge = document.getElementById('cardRadiusBadge');
    const inputColGap = document.getElementById('inputColGap');
    const colGapBadge = document.getElementById('colGapBadge');
    const inputRowGap = document.getElementById('inputRowGap');
    const rowGapBadge = document.getElementById('rowGapBadge');
    const inputStepOffset = document.getElementById('inputStepOffset');
    const stepOffsetBadge = document.getElementById('stepOffsetBadge');
    const inputGridX = document.getElementById('inputGridX');
    const gridXBadge = document.getElementById('gridXBadge');
    const inputGridY = document.getElementById('inputGridY');
    const gridYBadge = document.getElementById('gridYBadge');

    const coverContainer = document.getElementById('cover-container');
    const posterGrid = document.getElementById('posterGrid');
    const fileInput = document.getElementById('fileInput');
    const imageList = document.getElementById('imageList');
    const imgCount = document.getElementById('imgCount');
    const previewViewport = document.getElementById('previewViewport');
    const scalerWrapper = document.getElementById('scalerWrapper');

    // 选项卡切换
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));

      const targetBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.getAttribute('onclick')?.includes(tabId));
      if (targetBtn) targetBtn.classList.add('active');

      const targetPanel = document.getElementById(tabId);
      if (targetPanel) targetPanel.classList.add('active');
    }



    // 预设排版模式快速应用
    function applyLayoutMode(mode) {
      document.querySelectorAll('.preset-mode-btn').forEach(b => b.classList.remove('active'));
      const targetBtn = Array.from(document.querySelectorAll('.preset-mode-btn')).find(b => b.getAttribute('onclick')?.includes(mode));
      if (targetBtn) targetBtn.classList.add('active');

      if (mode === 'expanded') {
        // 完全展开、不重叠
        cardAngle.value = 15;
        inputCardW.value = 240;
        inputCardRadius.value = 22;
        inputColGap.value = 350;
        inputRowGap.value = 370;
        inputStepOffset.value = 35;
        inputGridX.value = 900;
        inputGridY.value = -30;
      } else if (mode === 'cascade') {
        // 经典错落
        cardAngle.value = 20;
        inputCardW.value = 330;
        inputCardRadius.value = 36;
        inputColGap.value = 360;
        inputRowGap.value = 420;
        inputStepOffset.value = 55;
        inputGridX.value = 860;
        inputGridY.value = -60;
      } else if (mode === 'grid') {
        // 齐整方阵
        cardAngle.value = 0;
        inputCardW.value = 240;
        inputCardRadius.value = 18;
        inputColGap.value = 280;
        inputRowGap.value = 360;
        inputStepOffset.value = 0;
        inputGridX.value = 980;
        inputGridY.value = -10;
      }

      cardAngleBadge.textContent = cardAngle.value + '°';
      cardWidthBadge.textContent = inputCardW.value + 'px';
      cardRadiusBadge.textContent = inputCardRadius.value + 'px';
      colGapBadge.textContent = inputColGap.value + 'px';
      rowGapBadge.textContent = inputRowGap.value + 'px';
      stepOffsetBadge.textContent = inputStepOffset.value + 'px';
      gridXBadge.textContent = inputGridX.value + 'px';
      gridYBadge.textContent = inputGridY.value + 'px';

      renderPosters();
    }
    function calculateCardPositions() {
      const baseX = parseFloat(inputGridX.value) || 860;
      const baseY = parseFloat(inputGridY.value) || -60;
      const colGap = parseFloat(inputColGap.value) || 360;
      const rowGap = parseFloat(inputRowGap.value) || 420;
      const stepOffset = parseFloat(inputStepOffset.value) || 55;

      const positions = [];
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          positions.push({
            x: baseX + c * colGap,
            y: baseY + r * rowGap + c * stepOffset
          });
        }
      }
      return positions;
    }

    // 智能等比自适应缩放
    function autoScaleViewport() {
      const vWidth = previewViewport.clientWidth - 20;
      const vHeight = previewViewport.clientHeight - 20;
      if (vWidth <= 0 || vHeight <= 0) return;
      const scaleX = vWidth / 1920;
      const scaleY = vHeight / 1080;
      const scale = Math.min(scaleX, scaleY) * 0.96;
      scalerWrapper.style.transform = `scale(${scale})`;
    }

    const resizeObserver = new ResizeObserver(() => {
      autoScaleViewport();
    });
    resizeObserver.observe(previewViewport);

    // 1. 标题、字号、间距、颜色、平移绑定
    inputTitle.addEventListener('input', (e) => {
      previewTitle.textContent = e.target.value || '媒体库';
    });

    inputTitleSize.addEventListener('input', (e) => {
      const size = e.target.value + 'px';
      previewTitle.style.fontSize = size;
      titleSizeBadge.textContent = size;
    });

    inputTitleSpacing.addEventListener('input', (e) => {
      const sp = e.target.value + 'px';
      previewTitle.style.letterSpacing = sp;
      titleSpacingBadge.textContent = sp;
    });

    titleColor.addEventListener('input', (e) => {
      previewTitle.style.color = e.target.value;
    });

    subColor.addEventListener('input', (e) => {
      previewSubtitle.style.color = e.target.value;
    });

    function updateTitlePosition() {
      const x = inputTitleX.value;
      const y = inputTitleY.value;
      titleXBadge.textContent = `${x}px`;
      titleYBadge.textContent = `${y}px`;
      coverLeftBlock.style.transform = `translate(${x}px, ${y}px)`;
    }

    inputTitleX.addEventListener('input', updateTitlePosition);
    inputTitleY.addEventListener('input', updateTitlePosition);

    inputSubtitle.addEventListener('input', (e) => {
      previewSubtitle.textContent = (e.target.value || '').toUpperCase();
    });

    inputSubSize.addEventListener('input', (e) => {
      const size = e.target.value + 'px';
      previewSubtitle.style.fontSize = size;
      subSizeBadge.textContent = size;
    });

    inputSubSpacing.addEventListener('input', (e) => {
      const sp = e.target.value + 'px';
      previewSubtitle.style.letterSpacing = sp;
      subSpacingBadge.textContent = sp;
    });

    // 2. 字体选择与自定义字体上传
    let customFontFamily = null;

    fontSelect.addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === 'default') {
        previewTitle.style.fontFamily = 'inherit';
      } else if (val === 'custom') {
        previewTitle.style.fontFamily = customFontFamily ? `${customFontFamily}, inherit` : 'inherit';
      } else {
        previewTitle.style.fontFamily = val;
      }
    });

    fontInput.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      try {
        const fontData = await file.arrayBuffer();
        customFontFamily = 'CustomUserFont_' + Date.now();
        const fontFace = new FontFace(customFontFamily, fontData);
        await fontFace.load();
        document.fonts.add(fontFace);

        customFontOption.disabled = false;
        customFontOption.textContent = `⭐ 自定义字体 (${file.name})`;
        fontSelect.value = 'custom';
        previewTitle.style.fontFamily = `${customFontFamily}, inherit`;
      } catch (err) {
        console.error('加载字体文件失败:', err);
        alert('无法解析该字体文件，请确保格式为 .ttf / .otf / .woff / .woff2');
      }
    });

    // 3. 背景色彩
    colorStart.addEventListener('input', updateBackground);
    colorEnd.addEventListener('input', updateBackground);
    gradientAngle.addEventListener('change', updateBackground);

    function updateBackground() {
      const c1 = colorStart.value;
      const c2 = colorEnd.value;
      const angle = gradientAngle.value;

      if (angle === 'radial') {
        coverContainer.style.background = `radial-gradient(circle at 30% 70%, ${c1} 0%, ${c2} 100%)`;
      } else {
        coverContainer.style.background = `linear-gradient(${angle}, ${c1} 0%, ${c2} 100%)`;
      }
    }

    function applyPreset(name) {
      if (!PRESETS[name]) return;
      const p = PRESETS[name];
      colorStart.value = p.start;
      colorEnd.value = p.end;
      gradientAngle.value = p.angle;
      updateBackground();
    }

    function randomizeGradient() {
      const randomHex = () => '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
      colorStart.value = randomHex();
      colorEnd.value = randomHex();
      updateBackground();
    }

    // 4. 海报矩阵参数监听
    const bindRange = (inputEl, badgeEl, unit = 'px') => {
      inputEl.addEventListener('input', () => {
        badgeEl.textContent = inputEl.value + unit;
        renderPosters();
      });
    };

    bindRange(cardAngle, cardAngleBadge, '°');
    bindRange(inputCardW, cardWidthBadge, 'px');
    bindRange(inputCardRadius, cardRadiusBadge, 'px');
    bindRange(inputColGap, colGapBadge, 'px');
    bindRange(inputRowGap, rowGapBadge, 'px');
    bindRange(inputStepOffset, stepOffsetBadge, 'px');
    bindRange(inputGridX, gridXBadge, 'px');
    bindRange(inputGridY, gridYBadge, 'px');

    // 5. 海报网格与拖拽排序
    let draggedIndex = null;

    function renderPosters() {
      posterGrid.innerHTML = '';
      imageList.innerHTML = '';
      imgCount.textContent = currentPosters.length;

      const positions = calculateCardPositions();
      const currentAngle = parseFloat(cardAngle.value) || 20;
      const cardW = parseFloat(inputCardW.value) || 330;
      const cardH = Math.round(cardW * (462 / 330));
      const radius = parseFloat(inputCardRadius.value) || 36;

      for (let i = 0; i < 9; i++) {
        const item = currentPosters.length > 0 ? currentPosters[i % currentPosters.length] : null;
        const actualPosterIdx = currentPosters.length > 0 ? (i % currentPosters.length) : null;
        const pos = positions[i];

        const card = document.createElement('div');
        card.className = 'cover-card';
        card.style.left = `${pos.x}px`;
        card.style.top = `${pos.y}px`;
        card.style.width = `${cardW}px`;
        card.style.height = `${cardH}px`;
        card.style.borderRadius = `${radius}px`;
        card.style.transform = `rotate(${currentAngle}deg)`;
        card.title = item ? `【${item.name}】拖拽可调整顺序` : '无素材';

        if (actualPosterIdx !== null) {
          card.draggable = true;
          card.dataset.index = actualPosterIdx;

          card.addEventListener('dragstart', (e) => {
            draggedIndex = actualPosterIdx;
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', actualPosterIdx);
          });

          card.addEventListener('dragend', () => {
            card.classList.remove('dragging');
            document.querySelectorAll('.cover-card').forEach(el => el.classList.remove('drag-over'));
            document.querySelectorAll('.image-tag-item').forEach(el => el.classList.remove('drag-over'));
          });

          card.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            card.classList.add('drag-over');
          });

          card.addEventListener('dragleave', () => {
            card.classList.remove('drag-over');
          });

          card.addEventListener('drop', (e) => {
            e.preventDefault();
            card.classList.remove('drag-over');
            const targetIdx = actualPosterIdx;
            if (draggedIndex === null || draggedIndex === targetIdx) return;

            const movedItem = currentPosters.splice(draggedIndex, 1)[0];
            currentPosters.splice(targetIdx, 0, movedItem);
            draggedIndex = null;
            renderPosters();
          });
        }

        const img = document.createElement('img');
        img.crossOrigin = 'anonymous';
        img.src = item ? item.url : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="330" height="462" fill="%231e293b"><rect width="330" height="462"/></svg>';
        img.onerror = () => {
          img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="330" height="462" fill="%23334155"><rect width="330" height="462"/></svg>';
        };
        card.appendChild(img);
        posterGrid.appendChild(card);
      }

      if (currentPosters.length === 0) {
        imageList.innerHTML = '<div class="empty-placeholder">暂无素材，请上传本地图片</div>';
        return;
      }

      currentPosters.forEach((item, idx) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'image-tag-item';
        itemEl.draggable = true;
        itemEl.dataset.index = idx;

        itemEl.innerHTML = `
          <div class="item-drag-handle">⋮⋮</div>
          <img class="item-thumb" src="${item.url}" crossorigin="anonymous" />
          <div class="item-info" title="${item.name}">${idx + 1}. ${item.name}</div>
          <div class="item-actions">
            <button class="item-action-btn" onclick="moveItem(${idx}, -1)" title="上移" ${idx === 0 ? 'disabled style="opacity:0.3"' : ''}>▲</button>
            <button class="item-action-btn" onclick="moveItem(${idx}, 1)" title="下移" ${idx === currentPosters.length - 1 ? 'disabled style="opacity:0.3"' : ''}>▼</button>
            <button class="item-action-btn del-btn" onclick="removeImage(${idx})" title="删除">&times;</button>
          </div>
        `;

        itemEl.addEventListener('dragstart', (e) => {
          draggedIndex = idx;
          itemEl.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        itemEl.addEventListener('dragend', () => {
          itemEl.classList.remove('dragging');
          document.querySelectorAll('.image-tag-item').forEach(el => el.classList.remove('drag-over'));
        });

        itemEl.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          itemEl.classList.add('drag-over');
        });

        itemEl.addEventListener('dragleave', () => {
          itemEl.classList.remove('drag-over');
        });

        itemEl.addEventListener('drop', (e) => {
          e.preventDefault();
          itemEl.classList.remove('drag-over');
          const targetIndex = idx;
          if (draggedIndex === null || draggedIndex === targetIndex) return;

          const movedItem = currentPosters.splice(draggedIndex, 1)[0];
          currentPosters.splice(targetIndex, 0, movedItem);
          draggedIndex = null;
          renderPosters();
        });

        imageList.appendChild(itemEl);
      });
    }

    function moveItem(index, step) {
      const newIndex = index + step;
      if (newIndex < 0 || newIndex >= currentPosters.length) return;
      const temp = currentPosters[index];
      currentPosters[index] = currentPosters[newIndex];
      currentPosters[newIndex] = temp;
      renderPosters();
    }

    function removeImage(index) {
      currentPosters.splice(index, 1);
      renderPosters();
    }

    function clearAllPosters() {
      if (currentPosters.length === 0) return;
      if (confirm('确认清空所有海报素材吗？')) {
        currentPosters = [];
        renderPosters();
      }
    }

    function loadDefaultPosters() {
      currentPosters = JSON.parse(JSON.stringify(DEFAULT_POSTERS));
      renderPosters();
    }

    function importBatchUrls(override = false) {
      const textarea = document.getElementById('batchUrlInput');
      const text = textarea.value.trim();
      if (!text) {
        alert('请先输入至少一条海报图片 URL');
        return;
      }

      const lines = text.split('\n')
        .map(l => l.trim())
        .filter(l => l.length > 0 && /^https?:\/\//i.test(l));

      if (lines.length === 0) {
        alert('未识别到有效的 http/https 图片链接，请检查格式');
        return;
      }

      const newItems = lines.map((url, idx) => {
        let name = '在线海报 ' + (idx + 1);
        try {
          const parsed = new URL(url);
          const pathname = parsed.pathname;
          const fileName = pathname.substring(pathname.lastIndexOf('/') + 1);
          if (fileName) {
            name = decodeURIComponent(fileName.replace(/\.[^/.]+$/, ''));
          }
        } catch (e) {}

        return {
          id: 'url_' + Date.now() + '_' + idx,
          name: name || ('在线海报 ' + (idx + 1)),
          url: url
        };
      });

      if (override) {
        currentPosters = newItems;
      } else {
        currentPosters = [...currentPosters, ...newItems];
      }

      textarea.value = '';
      renderPosters();
    }

    // 6. 本地图片上传
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      const loadedItems = [];
      let pending = files.length;

      files.forEach((file, fIdx) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          loadedItems.push({
            id: 'upload_' + Date.now() + '_' + fIdx,
            name: file.name.replace(/\.[^/.]+$/, ''),
            url: event.target.result
          });
          pending--;
          if (pending === 0) {
            currentPosters = [...currentPosters, ...loadedItems];
            renderPosters();
          }
        };
        reader.readAsDataURL(file);
      });
    });

    const dropZone = document.querySelector('.file-drop-zone');
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = 'var(--accent)';
    });
    dropZone.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = 'var(--input-border)';
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = 'var(--input-border)';
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        fileInput.dispatchEvent(new Event('change'));
      }
    });

    // 7. 原生 HTML5 Canvas 绘制导出 (100% 像素级对齐)
    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y + radius, x + radius, y);
      ctx.closePath();
    }

    function loadImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    async function exportPoster() {
      const title = inputTitle.value || '媒体库';
      const subtitle = (inputSubtitle.value || '').toUpperCase();
      const titleSize = parseInt(inputTitleSize.value, 10) || 114;
      const titleSpacing = parseInt(inputTitleSpacing.value, 10) || 10;
      const subSize = parseInt(inputSubSize.value, 10) || 48;
      const subSpacing = parseInt(inputSubSpacing.value, 10) || 16;
      const offsetX = parseFloat(inputTitleX.value) || 0;
      const offsetY = parseFloat(inputTitleY.value) || 0;

      const rotAngle = parseFloat(cardAngle.value) || 20;
      const rotRad = (rotAngle * Math.PI) / 180;
      const cardW = parseFloat(inputCardW.value) || 330;
      const cardH = Math.round(cardW * (462 / 330));
      const radius = parseFloat(inputCardRadius.value) || 36;
      const positions = calculateCardPositions();

      const canvas = document.createElement('canvas');
      canvas.width = 1920;
      canvas.height = 1080;
      const ctx = canvas.getContext('2d');

      // 1. 背景渐变
      const c1 = colorStart.value;
      const c2 = colorEnd.value;
      const angleMode = gradientAngle.value;

      let bgGrad;
      if (angleMode === 'radial') {
        bgGrad = ctx.createRadialGradient(1920 * 0.3, 1080 * 0.7, 50, 1920 * 0.3, 1080 * 0.7, 1200);
        bgGrad.addColorStop(0, c1);
        bgGrad.addColorStop(1, c2);
      } else if (angleMode === '45deg') {
        bgGrad = ctx.createLinearGradient(0, 1080, 1920, 0);
        bgGrad.addColorStop(0, c1);
        bgGrad.addColorStop(1, c2);
      } else if (angleMode === '90deg') {
        bgGrad = ctx.createLinearGradient(0, 0, 1920, 0);
        bgGrad.addColorStop(0, c1);
        bgGrad.addColorStop(1, c2);
      } else if (angleMode === '180deg') {
        bgGrad = ctx.createLinearGradient(0, 0, 0, 1080);
        bgGrad.addColorStop(0, c1);
        bgGrad.addColorStop(1, c2);
      } else {
        bgGrad = ctx.createLinearGradient(0, 0, 1920 * 0.8, 1080);
        bgGrad.addColorStop(0, c1);
        bgGrad.addColorStop(1, c2);
      }
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 1920, 1080);

      // 2. 海报卡片
      const imgPromises = positions.map((_, i) => {
        const item = currentPosters.length > 0 ? currentPosters[i % currentPosters.length] : null;
        return item ? loadImage(item.url) : Promise.resolve(null);
      });
      const loadedImgs = await Promise.all(imgPromises);

      positions.forEach((pos, i) => {
        const imgObj = loadedImgs[i];

        ctx.save();
        ctx.translate(pos.x + cardW / 2, pos.y + cardH / 2);
        ctx.rotate(rotRad);
        ctx.translate(-cardW / 2, -cardH / 2);

        ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
        ctx.shadowBlur = 40;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 16;

        ctx.fillStyle = '#1e293b';
        roundRect(ctx, 0, 0, cardW, cardH, radius);
        ctx.fill();

        ctx.shadowColor = 'transparent';
        ctx.save();
        roundRect(ctx, 0, 0, cardW, cardH, radius);
        ctx.clip();

        if (imgObj) {
          const imgAspect = imgObj.width / imgObj.height;
          const cardAspect = cardW / cardH;
          let drawW, drawH, drawX, drawY;

          if (imgAspect > cardAspect) {
            drawH = cardH;
            drawW = cardH * imgAspect;
            drawX = (cardW - drawW) / 2;
            drawY = 0;
          } else {
            drawW = cardW;
            drawH = cardW / imgAspect;
            drawX = 0;
            drawY = (cardH - drawH) / 2;
          }
          ctx.drawImage(imgObj, drawX, drawY, drawW, drawH);
        } else {
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(0, 0, cardW, cardH);
        }
        ctx.restore();
        ctx.restore();
      });

      // 3. 文字渲染
      ctx.save();
      const leftMargin = 120 + offsetX;
      let titleFont = 'sans-serif';
      const fontVal = fontSelect.value;
      if (fontVal === 'custom' && customFontFamily) {
        titleFont = `"${customFontFamily}", sans-serif`;
      } else if (fontVal !== 'default' && fontVal !== 'custom') {
        titleFont = fontVal;
      }

      ctx.font = `bold ${titleSize}px ${titleFont}`;
      ctx.fillStyle = titleColor.value || '#ffffff';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
      ctx.shadowBlur = 20;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 4;
      ctx.textBaseline = 'alphabetic';

      const lineGap = titleSize * 1.15;
      const textLines = title.split('\n');
      const totalTextHeight = textLines.length * lineGap + (subtitle ? subSize + 30 : 0);
      let curY = (1080 - totalTextHeight) / 2 + titleSize * 0.85 + offsetY;

      textLines.forEach(line => {
        let curX = leftMargin;
        for (const char of line) {
          ctx.fillText(char, curX, curY);
          curX += ctx.measureText(char).width + titleSpacing;
        }
        curY += lineGap;
      });

      if (subtitle) {
        curY += 10;
        ctx.font = `600 ${subSize}px "SF Mono", "Segoe UI Mono", "Roboto Mono", Menlo, Courier, monospace`;
        ctx.fillStyle = subColor.value || 'rgba(255, 255, 255, 0.88)';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
        ctx.shadowBlur = 10;
        let subX = leftMargin + 4;
        for (const char of subtitle) {
          ctx.fillText(char, subX, curY);
          subX += ctx.measureText(char).width + subSpacing;
        }
      }
      ctx.restore();

      // 4. 下载
      const link = document.createElement('a');
      link.download = `poster_${title}_1080p.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // html真厉害
    updateBackground();
    renderPosters();
    setTimeout(autoScaleViewport, 60);
  </script>
</body>
